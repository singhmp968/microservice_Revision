server:
  port: 8080
spring:
  application:
    name: "accounts"
  cloud:
    service-registry:
      auto-registration:
        enabled: true
  profiles:
    active: "prod"
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import: "optional:configserver:http://localhost:8071/"
#  rabbitmq:
#    host: "localhost"
#    port: 5672
#    username: "guest"
#    password: "guest"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
eureka:
  instance:
    preferIpAddress: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/
info:
  app:
    name: "accounts"
    description: "Accounts microservice for EazyBank"
    version: "1.0.0"
logging:
  level:
    com:
      eazybytes:
        accounts: DEBUG
resilience4j:
  circuitbreaker:
    configs:
      default:
        #        registerHealthIndicator: true
        slidingWindowSize: 10
        #        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
resilience4j.retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 100
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        ignoreExceptions:
          - java.lang.NullPointerException
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
resilience4j.rateLimiter:
    configs:
      default:
        limitForPeriod: 1000
        limitRefreshPeriod: 5000
        timeoutDuration: 1